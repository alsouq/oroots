name: task-reminders
on:
  schedule:
    - cron: '5 * * * *'      # كل ساعة (UTC) — السكربت نفسه بيفلتر ساعات العمل بتوقيت القاهرة
  workflow_dispatch:          # تشغيل يدوي للتجربة
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save firebase-admin@12
      - run: node send-reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
